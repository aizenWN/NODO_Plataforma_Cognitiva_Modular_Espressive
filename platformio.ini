; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = seeed_xiao_esp32s3

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = espidf
; Cuando compilemos para el ESP32, ignoramos la carpeta del emulador
lib_ignore = hal_windows

; Configuración del monitor serial para ver los logs correctamente
monitor_speed = 115200
monitor_filters = esp32_exception_decodern ; Traduce las fallas incomprensibles a texto entendible

; Opciones para compilar aprovechando la memoria extra del modelo Sense
board_build.flash_mode = qio
board_upload.flash_size = 8MB




; Universo 2: El Emulador en tu PC (Windows/Mac/Linux)
[env:emulador_windows]
platform = native
; Cuando compilemos para PC, ignoramos los cables y el ESP-IDF
lib_ignore = hal_esp32
build_flags = -lgdi32   ; <--- ESTA ES LA MAGIA QUE PERMITE DIBUJAR VENTANAS
